[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-pipeline"
version = "0.1.0"
description = "自动生成小说并发布到指定平台的全自动工作流（MVP 脚手架）"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]

[tool.setuptools.packages.find]
include = ["novel_pipeline*"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
