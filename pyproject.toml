[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-editorial"
version = "0.1.0"
description = "文学编辑部：AI 网文多 Agent 协作创作与发布平台"
requires-python = ">=3.9"
dependencies = ["websocket-client>=1.0"]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]

[tool.setuptools.packages.find]
include = ["novel_editorial*"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
