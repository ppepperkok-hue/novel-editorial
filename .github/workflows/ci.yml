name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Verify constitution
        run: python scripts/verify_constitution.py
